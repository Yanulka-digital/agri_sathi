name: Build Agri Sathi APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Generate Android Structure
        run: |
          flutter create . --platforms=android --project-name agri_sathi --org com.agrisathi

      - name: Fix Gradle Plugin Configuration
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle
          echo "" >> android/build.gradle
          echo "subprojects { subproject ->" >> android/build.gradle
          echo "    afterEvaluate {" >> android/build.gradle
          echo "        if (subproject.hasProperty('android')) {" >> android/build.gradle
          echo "            subproject.android {" >> android/build.gradle
          echo "                compileSdkVersion 34" >> android/build.gradle
          echo "            }" >> android/build.gradle
          echo "        }" >> android/build.gradle
          echo "    }" >> android/build.gradle
          echo "}" >> android/build.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Agri-Sathi-APK
          path: build/app/outputs/flutter-apk/app-release.apk
